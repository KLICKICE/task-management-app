databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: oleksandr
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)

  - changeSet:
      id: create-users-roles-table
      author: oleksandr
      changes:
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            columnNames: user_id, role_id
            tableName: users_roles
            constraintName: pk_users_roles
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: users_roles
            referencedColumnNames: id
            referencedTableName: users
            constraintName: fk_users_roles_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseColumnNames: role_id
            baseTableName: users_roles
            referencedColumnNames: id
            referencedTableName: roles
            constraintName: fk_users_roles_role
            onDelete: CASCADE
