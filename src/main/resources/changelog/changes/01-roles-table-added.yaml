databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: oleksandr
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            columnNames: role_name
            tableName: roles
            constraintName: uq_roles_role_name
