databaseChangeLog:
  - changeSet:
      id: create-labels-table
      author: oleksandr
      changes:
        - createTable:
            tableName: labels
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            columnNames: name
            tableName: labels
            constraintName: uq_labels_name
