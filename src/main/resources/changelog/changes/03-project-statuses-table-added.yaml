- changeSet:
    id: create-and-insert-project-statuses
    author: oleksandr
    changes:
      - createTable:
          tableName: project_statuses
          columns:
            - column:
                name: id
                type: BIGINT
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: status_project
                type: VARCHAR(255)
                constraints:
                  nullable: false

      - insert:
          tableName: project_statuses
          columns:
            - column:
                name: id
                valueNumeric: 1
            - column:
                name: status_project
                value: NEW

      - insert:
          tableName: project_statuses
          columns:
            - column:
                name: id
                valueNumeric: 2
            - column:
                name: status_project
                value: IN_PROGRESS

      - insert:
          tableName: project_statuses
          columns:
            - column:
                name: id
                valueNumeric: 3
            - column:
                name: status_project
                value: COMPLETED
