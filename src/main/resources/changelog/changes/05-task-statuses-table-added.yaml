databaseChangeLog:
  - changeSet:
      id: create-task-statuses-table
      author: oleksandr
      changes:
        - createTable:
            tableName: task_statuses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status_task
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            columnNames: status_task
            tableName: task_statuses
            constraintName: uq_task_statuses_status_task
